# PostgreSQL para desarrollo. Uso: copiar .env.example como .env y ejecutar `docker compose up -d`
services:
  postgres:
    image: postgres:16
    container_name: techloan-db
    environment:
      POSTGRES_DB: techloan
      POSTGRES_USER: techloan
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    ports:
      - "5432:5432"
    volumes:
      - techloan-datos:/var/lib/postgresql/data

volumes:
  techloan-datos:
