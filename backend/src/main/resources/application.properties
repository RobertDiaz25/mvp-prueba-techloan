# TechLoan API · configuración (HU-11)
# Los valores sensibles se leen de variables de entorno. No guardes contraseñas reales en este archivo.
spring.application.name=techloan-api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/techloan}
spring.datasource.username=${DB_USER:techloan}
spring.datasource.password=${DB_PASSWORD:}

# Flyway crea las tablas (db/migration); Hibernate solo valida que coincidan con las entidades.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Estrategia de sesión acordada: sesión de servidor, cookie JSESSIONID HttpOnly y SameSite=Lax, 2 h de inactividad.
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Cuentas ficticias de prueba: solo se crean si defines TECHLOAN_SEED_PASSWORD y la tabla de usuarios está vacía.
techloan.semilla.password=${TECHLOAN_SEED_PASSWORD:}
